name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Proves the demo config is valid without deploying (no account or secrets needed).
      - run: npx wrangler deploy --dry-run --env demo --outdir "$RUNNER_TEMP/demo-dry-run"
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
