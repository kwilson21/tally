name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 26 has Temporal built in; test:feedback-integration runs the app under plain Node, and src/dates.ts uses it.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # Proves the demo and production configs are valid without deploying (no account or secrets needed).
      - run: npx wrangler deploy --dry-run --env demo --outdir "$RUNNER_TEMP/demo-dry-run"
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/production-dry-run"
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run typecheck
      # Decision 188: Dafny checks the contracts on the files in LemmaScript-files.txt. Pinned by version and checksum;
      # the unpacked tool is dev-only and never part of the Worker.
      - name: Install Dafny 4.9.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dafny.zip" https://github.com/dafny-lang/dafny/releases/download/v4.9.0/dafny-4.9.0-x64-ubuntu-20.04.zip
          echo "b21575395f2fe3dbcaca09a8219fe29c99d248134e516e95dc3f0c3687d16c27  $RUNNER_TEMP/dafny.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP/dafny-install"
          echo "$RUNNER_TEMP/dafny-install/dafny" >> "$GITHUB_PATH"
      - run: npx lsc check --backend=dafny
      - run: npm run lint
      - run: npm run test:feedback-integration
      - run: npm test
