name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Forks get a read-only token and can't push images or edit the description.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:feedback-preview
      - run: npm run db:migrate:local
      - name: Start the app and seed the demo
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 2; done
          npm run db:seed:local
      - run: npm run screenshots
      # The same pages on the base branch, so the PR description can show what changed (#60).
      - name: Screenshot the base branch for before and after
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach ../base "$BASE_SHA"
          (
            cd ../base
            npm ci
            npm run build
            npm run db:migrate:local
            npx wrangler dev --port 8788 --inspector-port 9230 > "$GITHUB_WORKSPACE/base-wrangler.log" 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8788/healthz && break; sleep 2; done
            curl -fsS http://127.0.0.1:8788/cdn-cgi/handler/scheduled
          )
          # The base's own console errors aren't this PR's; its images are only for comparison.
          OUT=screenshots-before BASE_URL=http://127.0.0.1:8788 npm run screenshots || true
          node scripts/changed-shots.mjs
      # After the screenshots: the E2E changes the demo data.
      - run: npm run e2e
      - name: Publish images to the screenshots branch
        id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dir="pr-${PR}/${SHA::7}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the images the description shows (#756), staged by scripts/changed-shots.mjs as the
          # folder's layout: changed pages' after images at the top, their before images in before/.
          stage="${RUNNER_TEMP:?}/stage"
          rm -rf "$stage"
          mkdir -p "$stage/$dir"
          cp -r screenshots/shown/. "$stage/$dir/"
          # The commit is built from the branch's file list in a scratch index, so the images already on
          # the branch are never downloaded (#759): only the new ones are pushed. The filtered fetch makes
          # origin a blob-less remote for the rest of this job, and GIT_NO_LAZY_FETCH turns any command that
          # would quietly download an existing image into a failure instead.
          export GIT_INDEX_FILE="$RUNNER_TEMP/shots.index"
          export GIT_NO_LAZY_FETCH=1
          empty=$(git hash-object -t tree /dev/null)
          for i in 1 2 3; do
            rm -f "$GIT_INDEX_FILE"
            if git fetch --depth=1 --filter=blob:none origin screenshots; then
              base=$(git rev-parse FETCH_HEAD)
              git read-tree "$base"
            else
              base=""
            fi
            # A re-run of the same commit replaces its folder, so images it no longer shows are removed (#756).
            git rm -r -q -f --cached --ignore-unmatch -- "$dir"
            if [ -n "$(find "$stage/$dir" -type f -print -quit)" ]; then
              git --work-tree="$stage" add -- "$dir"
            fi
            tree=$(git write-tree --missing-ok)
            # Nothing new (no changed page, or a re-run with the same images): the branch stays as it is.
            if [ "$tree" = "$(git rev-parse "${base:-$empty}^{tree}")" ]; then pushed=1; break; fi
            commit=$(git commit-tree "$tree" ${base:+-p "$base"} -m "chore: screenshots for #${PR} at ${SHA::7}")
            # A push that loses a race to another run starts again from the branch's new tip.
            if git push origin "$commit:refs/heads/screenshots"; then pushed=1; break; fi
          done
          [ -n "${pushed:-}" ] || { echo "Could not push screenshots"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Update the PR description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIR: ${{ steps.publish.outputs.dir }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/update-pr-body.mjs
      - if: failure()
        run: |
          tail -50 wrangler.log || true
          tail -50 base-wrangler.log || true
